<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#344054"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff"/>

  <rect x="330" y="20" width="340" height="70" rx="10" fill="#eef4ff" stroke="#2f6fed"/>
  <text x="500" y="47" text-anchor="middle" font-weight="700" font-size="15">Клієнт (браузер)</text>
  <text x="500" y="68" text-anchor="middle" fill="#475467">index.html (задачі) · admin.html (панель адміністратора)</text>

  <line x1="500" y1="90" x2="500" y2="140" stroke="#344054" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="510" y="112" fill="#344054">HTTPS :8443 (TLS), JWT у заголовку</text>
  <text x="510" y="128" fill="#667085" font-size="12">HTTP :8080 → 301 на HTTPS</text>

  <rect x="150" y="140" width="700" height="190" rx="12" fill="#fff8eb" stroke="#c98200" stroke-width="2"/>
  <text x="500" y="165" text-anchor="middle" font-weight="700" font-size="16">Власний балансувальник навантаження (Node.js, balancer/)</text>
  <rect x="170" y="180" width="200" height="66" rx="8" fill="#fff" stroke="#e0b25c"/>
  <text x="270" y="200" text-anchor="middle" font-weight="600">HTTPS-проксі</text>
  <text x="270" y="218" text-anchor="middle" font-size="12">Адаптивний Smooth</text>
  <text x="270" y="234" text-anchor="middle" font-size="12">Weighted Round Robin</text>
  <rect x="390" y="180" width="220" height="66" rx="8" fill="#fff" stroke="#e0b25c"/>
  <text x="500" y="200" text-anchor="middle" font-weight="600">Планувальник задач</text>
  <text x="500" y="218" text-anchor="middle" font-size="12">Minimum Completion Time,</text>
  <text x="500" y="234" text-anchor="middle" font-size="12">черга + оцінка часу очікування</text>
  <rect x="630" y="180" width="200" height="66" rx="8" fill="#fff" stroke="#e0b25c"/>
  <text x="730" y="200" text-anchor="middle" font-weight="600">Автомасштабування</text>
  <text x="730" y="218" text-anchor="middle" font-size="12">запуск / зупинка серверів</text>
  <text x="730" y="234" text-anchor="middle" font-size="12">MIN=2 … MAX=4</text>
  <rect x="170" y="256" width="320" height="58" rx="8" fill="#fff" stroke="#e0b25c"/>
  <text x="330" y="278" text-anchor="middle" font-weight="600">Перевірка здоров'я (heartbeat 1 с)</text>
  <text x="330" y="296" text-anchor="middle" font-size="12">CPU, слоти, швидкість · самовідновлення</text>
  <rect x="510" y="256" width="320" height="58" rx="8" fill="#fff" stroke="#e0b25c"/>
  <text x="670" y="278" text-anchor="middle" font-weight="600">Admin API /api/admin/*</text>
  <text x="670" y="296" text-anchor="middle" font-size="12">моніторинг серверів, черги, журнал подій</text>

  <line x1="300" y1="330" x2="180" y2="420" stroke="#344054" stroke-width="2" marker-end="url(#a)"/>
  <line x1="420" y1="330" x2="420" y2="420" stroke="#344054" stroke-width="2" marker-end="url(#a)"/>
  <line x1="580" y1="330" x2="660" y2="420" stroke="#2f6fed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="232" y="372" text-anchor="end" fill="#344054" font-size="12">HTTP-запити (REST, статика)</text>
  <text x="640" y="372" fill="#2f6fed" font-size="12">POST /internal/execute,</text>
  <text x="640" y="388" fill="#2f6fed" font-size="12">GET /internal/status</text>

  <g>
    <rect x="40" y="420" width="250" height="150" rx="10" fill="#eefaf2" stroke="#1f9d55" stroke-width="2"/>
    <text x="165" y="444" text-anchor="middle" font-weight="700">app-1 :9001 (базовий)</text>
    <text x="165" y="466" text-anchor="middle" font-size="12">Express: REST API, авторизація</text>
    <text x="165" y="484" text-anchor="middle" font-size="12">Executor: 2 слоти</text>
    <rect x="65" y="498" width="95" height="56" rx="6" fill="#fff" stroke="#1f9d55"/>
    <text x="112" y="522" text-anchor="middle" font-size="12">worker_thread</text>
    <text x="112" y="540" text-anchor="middle" font-size="12">Гаусс</text>
    <rect x="170" y="498" width="95" height="56" rx="6" fill="#fff" stroke="#1f9d55"/>
    <text x="217" y="522" text-anchor="middle" font-size="12">worker_thread</text>
    <text x="217" y="540" text-anchor="middle" font-size="12">Гаусс</text>
  </g>
  <g>
    <rect x="300" y="420" width="250" height="150" rx="10" fill="#eefaf2" stroke="#1f9d55" stroke-width="2"/>
    <text x="425" y="444" text-anchor="middle" font-weight="700">app-2 :9002 (базовий)</text>
    <text x="425" y="466" text-anchor="middle" font-size="12">Express: REST API, авторизація</text>
    <text x="425" y="484" text-anchor="middle" font-size="12">Executor: 2 слоти</text>
    <rect x="325" y="498" width="95" height="56" rx="6" fill="#fff" stroke="#1f9d55"/>
    <text x="372" y="522" text-anchor="middle" font-size="12">worker_thread</text>
    <text x="372" y="540" text-anchor="middle" font-size="12">Гаусс</text>
    <rect x="430" y="498" width="95" height="56" rx="6" fill="#fff" stroke="#1f9d55"/>
    <text x="477" y="522" text-anchor="middle" font-size="12">worker_thread</text>
    <text x="477" y="540" text-anchor="middle" font-size="12">Гаусс</text>
  </g>
  <g>
    <rect x="560" y="420" width="250" height="150" rx="10" fill="#f6f7f9" stroke="#98a2b3" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="685" y="444" text-anchor="middle" font-weight="700">app-3, app-4 :9003…</text>
    <text x="685" y="466" text-anchor="middle" font-size="12">запускаються автоматично,</text>
    <text x="685" y="484" text-anchor="middle" font-size="12">коли черга не порожня,</text>
    <text x="685" y="502" text-anchor="middle" font-size="12">і зупиняються після простою</text>
    <text x="685" y="530" text-anchor="middle" font-size="12" fill="#667085">(child_process.fork)</text>
  </g>

  <rect x="840" y="420" width="140" height="150" rx="10" fill="#f3efff" stroke="#6941c6" stroke-width="2"/>
  <text x="910" y="470" text-anchor="middle" font-weight="700">PostgreSQL</text>
  <text x="910" y="492" text-anchor="middle" font-size="12">users</text>
  <text x="910" y="510" text-anchor="middle" font-size="12">tasks (черга,</text>
  <text x="910" y="526" text-anchor="middle" font-size="12">прогрес, історія,</text>
  <text x="910" y="542" text-anchor="middle" font-size="12">результати)</text>

  <path d="M165 570 V 640 H 910 V 570" fill="none" stroke="#6941c6" stroke-width="2" marker-end="url(#a)"/>
  <line x1="425" y1="570" x2="425" y2="640" stroke="#6941c6" stroke-width="2"/>
  <line x1="685" y1="570" x2="685" y2="640" stroke="#6941c6" stroke-width="2"/>
  <text x="500" y="660" text-anchor="middle" fill="#6941c6" font-size="12">SQL: створення задач, прогрес кожні 0,5 с, скасування, результати</text>
  <path d="M850 260 H 940 V 420" fill="none" stroke="#6941c6" stroke-width="2" marker-end="url(#a)"/>
  <text x="932" y="350" text-anchor="end" fill="#6941c6" font-size="12">черга, ETA,</text>
  <text x="932" y="366" text-anchor="end" fill="#6941c6" font-size="12">відновлення задач</text>
</svg>
